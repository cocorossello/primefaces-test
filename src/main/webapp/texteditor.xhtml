<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<f:view>
    <h:head></h:head>
    <h:body>
        <h:form id="form1">
            <p:commandButton value="Start edit" action="#{textEditorView.startEdit}" update="@form" />

            <ui:fragment rendered="#{textEditorView.editing}">

                <p:textEditor value="#{textEditorView.text}" autoResize="true" style="width: 100%; height: 200px;" secure="false" />
                <br/>
                <br/>

                <p:commandButton value="Save" action="#{textEditorView.save}" update="@form" />
            </ui:fragment>
        </h:form>
    </h:body>
</f:view>
</html>
